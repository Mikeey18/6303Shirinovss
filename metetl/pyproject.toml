[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metetl"
version = "1.0.0"
description = "MET ETL Pipeline for artworks processing"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=22.0.0",
    "numpy>=1.21.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
metetl = "metetl.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]